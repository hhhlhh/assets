server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: fixed-asset-management

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.12.209:3306/asset_management?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: rootroot

  jpa:
    database-platform: org.hibernate.dialect.MySQL5InnoDBDialect
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  http:
    encoding:
      charset: UTF-8
      force: true

# 跨域配置
cors:
  allowed-origins: "http://localhost:3000,http://127.0.0.1:3000"
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "*"
  allow-credentials: true

# 日志配置
logging:
  level:
    com.assetmanagement: INFO
    org.springframework.web: INFO
  file:
    name: logs/asset-management.log

# 应用配置
app:
  export:
    template-path: /soft/excl/
    download-path: /tmp/exports/
