version: '3.8'

services:
  app:
    build: .
    container_name: fixed-asset-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://192.168.12.209:3306/fixed_asset_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootroot
      JWT_SECRET: mySecretKeyForJWTTokenGenerationAndValidation12345
      JWT_EXPIRATION: 86400
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:

networks:
  fixed-asset-network:
    driver: bridge