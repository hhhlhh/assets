<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>资产管理 - 固定资产系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .asset-status-in-use { border-left-color: #28a745; }
        .asset-status-idle { border-left-color: #ffc107; }
        .asset-status-maintenance { border-left-color: #dc3545; }
        .asset-status-scrapped { border-left-color: #6c757d; }
    </style>
</head>
<body>
<div class="container-fluid">
    <!-- Page Header -->
    <div class="row mb-4">
        <div class="col">
            <h1><i class="fas fa-boxes"></i> 资产管理</h1>
            <p class="text-muted">管理系统中的所有固定资产</p>
        </div>
        <div class="col-auto">
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addAssetModal">
                <i class="fas fa-plus"></i> 添加资产
            </button>
        </div>
    </div>

    <!-- Filters -->
    <div class="card mb-4">
        <div class="card-body">
            <form class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">搜索</label>
                    <input type="text" class="form-control" placeholder="按名称、型号或序列号搜索">
                </div>
                <div class="col-md-2">
                    <label class="form-label">资产类型</label>
                    <select class="form-select">
                        <option value="">全部类型</option>
                        <option value="DESKTOP">台式机</option>
                        <option value="LAPTOP">笔记本</option>
                        <option value="PRINTER">打印机</option>
                        <option value="MONITOR">显示器</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">状态</label>
                    <select class="form-select">
                        <option value="">全部状态</option>
                        <option value="IN_USE">在用</option>
                        <option value="IDLE">闲置</option>
                        <option value="MAINTENANCE">维修中</option>
                        <option value="SCRAPPED">报废</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">部门</label>
                    <select class="form-select">
                        <option value="">全部部门</option>
                        <option value="IT">IT部门</option>
                        <option value="HR">人力资源部</option>
                        <option value="FINANCE">财务部</option>
                        <option value="MARKETING">市场部</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button class="btn btn-outline-secondary w-100">
                        <i class="fas fa-search"></i> 搜索
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Assets Table -->
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0">资产列表</h5>
            <div>
                <button class="btn btn-sm btn-outline-secondary me-2">
                    <i class="fas fa-download"></i> 导出
                </button>
                <button class="btn btn-sm btn-outline-primary">
                    <i class="fas fa-sync-alt"></i> 刷新
                </button>
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>资产编号</th>
                            <th>资产名称</th>
                            <th>类型</th>
                            <th>序列号</th>
                            <th>状态</th>
                            <th>位置</th>
                            <th>所属部门</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="asset : ${assets}">
                            <td th:text="${asset.id}">1</td>
                            <td th:text="${asset.name}">笔记本电脑 Dell XPS 13</td>
                            <td>
                                <span class="badge bg-info" th:text="${asset.type.displayName}">笔记本</span>
                            </td>
                            <td th:text="${asset.serialNumber}">SN123456</td>
                            <td>
                                <span class="badge" th:classappend="'bg-' +
                                    ${asset.status == 'IN_USE'} ? 'success' :
                                    ${asset.status == 'IDLE'} ? 'warning' :
                                    ${asset.status == 'MAINTENANCE'} ? 'danger' : 'secondary'"
                                      th:text="${asset.status.displayName}">在用</span>
                            </td>
                            <td th:text="${asset.location}">北京办公室</td>
                            <td th:text="${asset.department}">IT部门</td>
                            <td>
                                <div class="btn-group btn-group-sm">
                                    <button class="btn btn-outline-primary" title="查看详情">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    <button class="btn btn-outline-secondary" title="编辑">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-outline-danger" title="删除">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white">
            <nav aria-label="Page navigation">
                <ul class="pagination justify-content-center mb-0">
                    <li class="page-item disabled">
                        <a class="page-link" href="#" tabindex="-1">上一页</a>
                    </li>
                    <li class="page-item active"><a class="page-link" href="#">1</a></li>
                    <li class="page-item"><a class="page-link" href="#">2</a></li>
                    <li class="page-item"><a class="page-link" href="#">3</a></li>
                    <li class="page-item">
                        <a class="page-link" href="#">下一页</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<!-- Add Asset Modal -->
<div class="modal fade" id="addAssetModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">添加新资产</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">资产名称 *</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">资产类型 *</label>
                            <select class="form-select" required>
                                <option value="">请选择类型</option>
                                <option value="DESKTOP">台式机</option>
                                <option value="LAPTOP">笔记本</option>
                                <option value="PRINTER">打印机</option>
                                <option value="MONITOR">显示器</option>
                                <option value="SERVER">服务器</option>
                                <option value="NETWORK_DEVICE">网络设备</option>
                                <option value="FURNITURE">办公家具</option>
                                <option value="OTHER">其他</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">型号</label>
                            <input type="text" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">序列号 *</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">购买日期</label>
                            <input type="date" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">价格 (元)</label>
                            <input type="number" step="0.01" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">存放位置</label>
                            <input type="text" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">所属部门</label>
                            <select class="form-select">
                                <option value="">请选择部门</option>
                                <option value="IT">IT部门</option>
                                <option value="HR">人力资源部</option>
                                <option value="FINANCE">财务部</option>
                                <option value="MARKETING">市场部</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">描述</label>
                            <textarea class="form-control" rows="3"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary">保存资产</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
